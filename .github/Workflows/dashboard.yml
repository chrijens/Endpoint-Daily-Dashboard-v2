name: Microsoft Watch

on:
  schedule:
    # Hourly at :17. Off-the-hour times get scheduled more reliably —
    # GitHub delays jobs queued exactly on the hour under load.
    - cron: "17 * * * *"
  workflow_dispatch:        # adds a "Run workflow" button for manual runs
  push:
    branches: [main]
    paths: [ms_watch.py, .github/workflows/dashboard.yml]

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Runners are wiped between runs, so the seen-items file has to be
      # carried over in the cache or the "New" badge never fires.
      - name: Restore previous state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: ms-watch-state-${{ github.run_id }}
          restore-keys: |
            ms-watch-state-

      - name: Build dashboard
        env:
          TZ: Europe/London        # change to your timezone for the header stamp
        run: |
          python3 ms_watch.py \
            --output site/index.html \
            --state .state/seen.json \
            --refresh 60 \
            --strict

      # Unique key each run + the restore-keys prefix above = a rolling cache.
      - name: Save state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .state
          key: ms-watch-state-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
